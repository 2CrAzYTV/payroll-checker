services:
  payroll-checker:
    image: ghcr.io/2crazytv/payroll-checker:latest
    container_name: payroll-checker
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      APP_DATA_DIR: /data
    ports:
      - "8790:8788"
    volumes:
      - /mnt/user/appdata/payroll-checker:/data
